name: CI

on:
  pull_request:
  push:
    branches: [main]

# Allow only one concurrent run per ref; cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site (lint + build)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The site is deployable precisely because it has no backend. If a Base44 import ever
      # comes back, the build will still succeed and the deploy will still work — right up
      # until it tries to reach a service this project no longer uses.
      - name: Assert the bundle has no Base44 dependency
        run: |
          if grep -rq "base44" dist/; then
            echo "::error::dist/ references base44 — the site must build with no Base44 dependency"
            grep -rl "base44" dist/
            exit 1
          fi

  api:
    name: API (typecheck + test + wrangler dry-run)
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm exec wrangler deploy --dry-run --outdir dist
      # A dry-run only bundles: it does not start workerd, so it cannot catch an entrypoint that
      # the runtime rejects (a stray named export takes the Worker down at boot). Boot it.
      - name: Boot the Worker and probe it
        run: |
          pnpm exec wrangler dev --port 8787 --local &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/ >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8787/ | grep -q '"ok":true'
          curl -sf -X POST http://localhost:8787/mcp \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | grep -q '"tools"'
          kill %1

  deploy-api:
    name: Deploy API to Cloudflare
    needs: [site, api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: api
    # Manual approval gate: the "production" environment in repo settings has required reviewers.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          command: deploy --env production

  deploy-site:
    name: Deploy site to Cloudflare
    needs: [site, api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
