# CI runs anywhere; deploys run in exactly one place.
#
# This repo is mirrored to a public one and is meant to be forked. Two consequences are handled
# explicitly rather than left to fail confusingly:
#
#   - `runs-on` falls back to `ubuntu-latest` off the canonical repo. The self-hosted runners are
#     registered to NextSolutionsStudio/anatome-os only, so anywhere else these jobs would queue
#     forever with no error — a fork's CI that never starts looks like a broken project.
#   - The deploy jobs are pinned to the canonical repo by name. A fork has no Cloudflare
#     credentials, and more importantly must never be able to deploy over ours.
#
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Allow only one concurrent run per ref; cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site (lint + build)
    runs-on: ${{ github.repository == 'NextSolutionsStudio/anatome-os' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The site is deployable precisely because it has no backend. If a Base44 import ever
      # comes back, the build will still succeed and the deploy will still work — right up
      # until it tries to reach a service this project no longer uses.
      - name: Assert the bundle has no Base44 dependency
        run: |
          if grep -rq "base44" dist/; then
            echo "::error::dist/ references base44 — the site must build with no Base44 dependency"
            grep -rl "base44" dist/
            exit 1
          fi

  api:
    name: API (typecheck + test + wrangler dry-run)
    runs-on: ${{ github.repository == 'NextSolutionsStudio/anatome-os' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      # Accounts and logging run inside workerd against a real local D1. A hand-written D1 stub
      # would only prove the stub behaves the way its author imagined.
      - run: pnpm run test:workers
      - run: pnpm exec wrangler deploy --dry-run --outdir dist
      # A dry-run only bundles: it does not start workerd, so it cannot catch an entrypoint the
      # runtime rejects (a stray named export takes the Worker down at boot). Boot it for real.
      #
      # The port is chosen by the OS, not hard-coded. These runners are self-hosted and shared,
      # so a fixed 8787 collided with a concurrent job and failed this step on both open PRs —
      # a CI failure caused by CI, which is the least useful kind.
      - name: Boot the Worker and probe it
        run: |
          PORT=$(node -e 'const s=require("net").createServer();s.listen(0,"127.0.0.1",()=>{console.log(s.address().port);s.close()})')
          echo "Booting workerd on 127.0.0.1:$PORT"
          pnpm exec wrangler dev --port "$PORT" --ip 127.0.0.1 --local &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:$PORT/" >/dev/null; then break; fi
            sleep 2
          done
          curl -sf "http://127.0.0.1:$PORT/" | grep -q '"ok":true'
          curl -sf -X POST "http://127.0.0.1:$PORT/mcp" \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | grep -q '"tools"'

  deploy-api:
    name: Deploy API to Cloudflare
    needs: [site, api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NextSolutionsStudio/anatome-os'
    runs-on: ${{ github.repository == 'NextSolutionsStudio/anatome-os' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: api
    # NOTE: the "production" environment currently has NO protection rules, so this deploys
    # unattended on every push to main. That is deliberate for now. To require a human, add
    # required reviewers to the environment in repo settings — this line already routes through
    # it, so the gate takes effect with no workflow change.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Schema first: a deploy that adds a route reading a table the database does not have yet
      # fails for users, not for us. Migrations are additive and idempotent.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          wranglerVersion: "4"
          command: d1 migrations apply anatome --remote
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          wranglerVersion: "4"
          command: deploy --env production

  deploy-site:
    name: Deploy site to Cloudflare
    needs: [site, api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NextSolutionsStudio/anatome-os'
    runs-on: ${{ github.repository == 'NextSolutionsStudio/anatome-os' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned: if the repo's own wrangler is ever unusable, this action's default
          # fallback is wrangler 3, which silently deploys a different thing instead of failing.
          wranglerVersion: "4"
          command: deploy
      # Uploading the Worker and attaching a hostname to it need different Cloudflare permissions,
      # and this token only has the first (see wrangler.toml). So the route is bound by hand, once,
      # and this step reports whether that has happened yet rather than failing the build over it —
      # a job that is red on every push is a job everybody learns to scroll past.
      - name: Report cutover status
        run: |
          origin=$(curl -sS -m 15 -I https://anatome.dev/ | tr -d '\r' | grep -i '^x-render-origin-server:' || true)
          if [ -n "$origin" ]; then
            echo "::warning::anatome.dev is still on the old origin ($origin). The Worker is deployed and current, but nothing routes to it. One-time operator action: Cloudflare dashboard -> Workers & Pages -> anatome-site -> Settings -> Domains & Routes -> add anatome.dev/* and www.anatome.dev/*."
          else
            echo "anatome.dev is served by the Worker: cutover complete."
          fi
