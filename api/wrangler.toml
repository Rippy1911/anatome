name = "anatome-api"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# Exercise demo GIFs (generate: python3 scripts/generate-exercise-gifs.py)
[assets]
directory = "public"
binding = "ASSETS"

# Rate-limit storage (replaces the Base44 RateLimit entity).
# Create with:  wrangler kv namespace create RATE_LIMIT_KV
# then paste the returned id below (and a separate preview_id for `wrangler dev`).
# KV is now the fallback; the primary counter is the RateLimiterDO Durable Object
# below (no daily write quota). KV stays for local dev without a DO binding.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "42bad01f54734ee2a1a97efdb7cc617d"
preview_id = "c3ba21bd8352432d9754e6a9c68b594b"

# Durable Object rate limiter (primary counter). One instance per rate-limit key.
[[durable_objects.bindings]]
name = "RATE_LIMIT_DO"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDO"]

# Accounts and personal logging (meals, workouts, body weight).
#
# OPTIONAL. Comment this block out and the Worker still serves the entire catalog API — it just
# has no accounts and stops advertising the logging tools. That is a supported way to run it.
#
# Create with:  wrangler d1 create anatome
# then paste the returned database_id below, and apply the schema:
#               wrangler d1 migrations apply anatome            # remote
#               wrangler d1 migrations apply anatome --local     # local dev
[[d1_databases]]
binding = "DB"
database_name = "anatome"
database_id = "2d685f1a-cce3-4ace-bde4-dfc3efd2d735"
migrations_dir = "migrations"

[vars]
# Non-secret config only. Secrets are set with `wrangler secret put`:
#   wrangler secret put ADMIN_TOKEN      # operator endpoints (/admin/*)
#   wrangler secret put PROXY_SECRET     # optional; RapidAPI marketplace listing
#   wrangler secret put MCP_TRUSTED_KEY  # optional; first-party MCP bridge
#   wrangler secret put GITHUB_TOKEN     # optional; /ciStatus badge
PUBLIC_BASE_URL = "https://api.anatome.dev"

# ---- Fair use ----
# Anatome is keyless: no signup, no API key, no token to paste. The only gate is this daily
# budget per caller. Self-hosters: this is the number to change. Raise it, or set it absurdly
# high on a private deployment — nothing else needs editing.
FAIR_USE_DAILY_LIMIT = "50"

# Runaway guard only. A remote MCP connector reaches us from the assistant vendor's egress
# addresses, so fair use is counted per MCP session rather than per IP; this ceiling stops a
# script from re-minting sessions forever. It is NOT the fair-use number and should stay far
# above it. Cloudflare's WAF is the real flood layer.
ANON_NETWORK_DAILY_LIMIT = "10000"

# Where callers who need more than fair use are sent.
UPGRADE_URL = "https://platform.anatome.dev"

# ---- Production environment ----
[env.production]
name = "anatome-api"
workers_dev = false
routes = [
  { pattern = "api.anatome.dev/*", zone_name = "anatome.dev" }
]

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "42bad01f54734ee2a1a97efdb7cc617d"

[[env.production.durable_objects.bindings]]
name = "RATE_LIMIT_DO"
class_name = "RateLimiterDO"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDO"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "anatome"
database_id = "2d685f1a-cce3-4ace-bde4-dfc3efd2d735"
migrations_dir = "migrations"

[env.production.vars]
PUBLIC_BASE_URL = "https://api.anatome.dev"
FAIR_USE_DAILY_LIMIT = "50"
ANON_NETWORK_DAILY_LIMIT = "10000"
UPGRADE_URL = "https://platform.anatome.dev"

[env.production.assets]
directory = "public"
binding = "ASSETS"
